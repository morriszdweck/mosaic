name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun test tests/

      # The engine drops unknown config keys silently, so a rename upstream
      # would disable Mosaic's agents and memory without failing anything.
      # Boot it for real and assert they are still there.
      - name: Engine accepts the generated config
        run: |
          export MOSAIC_HOME="$RUNNER_TEMP/mosaic-ci"
          ./bin/mosaic --version
          ./bin/mosaic debug config > "$RUNNER_TEMP/resolved.json"
          bun -e '
            const raw = await Bun.file(process.env.RUNNER_TEMP + "/resolved.json").text();
            const cfg = JSON.parse(raw.slice(raw.indexOf("{")));
            const agents = Object.keys(cfg.agent ?? {});
            for (const name of ["mosaic", "writer", "analyst", "builder"]) {
              if (!agents.includes(name)) throw new Error(`agent "${name}" was dropped by the engine`);
            }
            if (!(cfg.plugin ?? []).some((p) => p.includes("memory"))) throw new Error("memory plugin was dropped");
            if (cfg.default_agent !== "mosaic") throw new Error("default_agent is " + cfg.default_agent);
            console.log("config accepted:", agents.join(", "));
          '

      - name: Memory tool is registered on the primary agent
        run: |
          export MOSAIC_HOME="$RUNNER_TEMP/mosaic-ci"
          ./bin/mosaic debug agent mosaic | grep -q '"memory": true'

      # Renaming is presentation, but a dropped provider key means the model
      # picker silently shows upstream codenames again.
      - name: Free tier is labelled and is the default
        run: |
          export MOSAIC_HOME="$RUNNER_TEMP/mosaic-ci"
          ./bin/mosaic debug config > "$RUNNER_TEMP/named.json"
          grep -q "Free (via OC Zen)" "$RUNNER_TEMP/named.json"
          grep -q "Mosaic Free" "$RUNNER_TEMP/named.json"

      # A ~/opencode.json used to leak its providers into Mosaic, because the
      # engine finds project config by walking up for that filename.
      - name: OpenCode project config does not leak in
        run: |
          export MOSAIC_HOME="$RUNNER_TEMP/mosaic-ci"
          printf '{"model":"leaked/model"}' > "$HOME/opencode.json"
          cd "$HOME"
          "$GITHUB_WORKSPACE/bin/mosaic" debug config > "$RUNNER_TEMP/leak.json"
          if grep -q "leaked/model" "$RUNNER_TEMP/leak.json"; then
            echo "OpenCode project config leaked into Mosaic" >&2
            exit 1
          fi
          rm -f "$HOME/opencode.json"

      - name: Every Mosaic tool is registered
        run: |
          export MOSAIC_HOME="$RUNNER_TEMP/mosaic-ci"
          ./bin/mosaic debug agent mosaic > "$RUNNER_TEMP/tools.json"
          for t in memory schedule heartbeat soul skill; do
            grep -q "\"$t\": true" "$RUNNER_TEMP/tools.json" || { echo "tool $t missing" >&2; exit 1; }
          done

      - name: Mosaic's own skills are installed
        run: |
          export MOSAIC_HOME="$RUNNER_TEMP/mosaic-ci"
          ./bin/mosaic debug skill > "$RUNNER_TEMP/skills.json"
          for s in agent-swarm customize-mosaic mosaic-self; do
            grep -q "\"$s\"" "$RUNNER_TEMP/skills.json" || { echo "skill $s missing" >&2; exit 1; }
          done

      # Swarm is fetched by install.sh, so CI vendors it the same way and
      # checks the orchestrator actually reaches the engine as an agent.
      - name: Swarm agents install and load
        run: |
          export MOSAIC_HOME="$RUNNER_TEMP/mosaic-ci"
          git clone --depth 1 -q https://github.com/morriszdweck/opencode-swarm vendor/swarm
          bun run src/swarm.ts
          test -f "$MOSAIC_HOME/config/opencode/agent/swarm.md"
          ./bin/mosaic debug config > "$RUNNER_TEMP/swarm.json"
          for a in swarm researcher reviewer optimizer designer; do
            grep -q "\"$a\"" "$RUNNER_TEMP/swarm.json" || { echo "swarm agent $a missing" >&2; exit 1; }
          done

      - name: Mosaic theme installs and build is disabled
        run: |
          export MOSAIC_HOME="$RUNNER_TEMP/mosaic-ci"
          bun run src/swarm.ts
          test -f "$MOSAIC_HOME/config/opencode/themes/mosaic.json"
          test -f "$MOSAIC_HOME/config/opencode/themes/mosaic-dark.json"
          grep -q '"theme": "mosaic"' "$MOSAIC_HOME/config/opencode/tui.json"
          ./bin/mosaic agent list > "$RUNNER_TEMP/agents.txt"
          grep -qE "^builder " "$RUNNER_TEMP/agents.txt"
          grep -qE "^designer " "$RUNNER_TEMP/agents.txt"
          grep -qE "^plan " "$RUNNER_TEMP/agents.txt"
          if grep -qE "^build |^coder |^uiux-designer " "$RUNNER_TEMP/agents.txt"; then
            echo "a retired agent name is still registered" >&2; exit 1
          fi

      # Branding lives in the TUI's own config; a plugin listed in the agent
      # config gets only its server half loaded and is silently never drawn.
      - name: Branding is registered in the TUI config
        run: |
          export MOSAIC_HOME="$RUNNER_TEMP/mosaic-ci"
          ./bin/mosaic --version >/dev/null
          grep -q "branding" "$MOSAIC_HOME/config/opencode/tui.json"
