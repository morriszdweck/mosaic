name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: bun-linux-x64, outfile: mosaic-linux-x64, os: ubuntu-latest }
          - { target: bun-linux-arm64, outfile: mosaic-linux-arm64, os: ubuntu-24.04-arm }
          - { target: bun-darwin-x64, outfile: mosaic-darwin-x64, os: macos-15 }
          - { target: bun-darwin-arm64, outfile: mosaic-darwin-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Test
        run: bun run test

      - name: Build binary
        run: |
          cd packages/cli
          bun run build.ts --outfile "../../${{ matrix.outfile }}"

      - name: Checksum
        run: shasum -a 256 "${{ matrix.outfile }}" > "${{ matrix.outfile }}.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.outfile }}
            ${{ matrix.outfile }}.sha256
