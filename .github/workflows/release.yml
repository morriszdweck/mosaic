name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: bun-linux-x64, outfile: mosaic-linux-x64, os: ubuntu-latest }
          - { target: bun-linux-arm64, outfile: mosaic-linux-arm64, os: ubuntu-24.04-arm }
          - { target: bun-darwin-x64, outfile: mosaic-darwin-x64, os: macos-15-intel }
          - { target: bun-darwin-arm64, outfile: mosaic-darwin-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Test
        run: bun run test

      # v0.1.3 shipped a binary that reported 0.1.0 because the tag moved and
      # the source constant did not. Fail the release instead of publishing a
      # binary that lies about its own version.
      - name: Check version matches tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          src="$(grep -o 'VERSION = "[^"]*"' packages/cli/src/index.ts | cut -d'"' -f2)"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$src" ] || [ "$tag" != "$pkg" ]; then
            echo "Version mismatch: tag=$tag index.ts=$src package.json=$pkg" >&2
            exit 1
          fi
          echo "version $tag ok"

      - name: Build binary
        run: |
          cd packages/cli
          bun run build.ts --outfile "../../${{ matrix.outfile }}" --target "${{ matrix.target }}"

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - "${{ matrix.outfile }}"

      # Must run after signing — codesign rewrites the binary in place.
      - name: Checksum
        run: shasum -a 256 "${{ matrix.outfile }}" > "${{ matrix.outfile }}.sha256"

      - name: Verify checksum file
        run: shasum -a 256 -c "${{ matrix.outfile }}.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.outfile }}
            ${{ matrix.outfile }}.sha256
